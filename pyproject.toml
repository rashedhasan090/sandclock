[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sandclock"
version = "0.1.0"
description = "Timebox a shell command and report the filesystem delta under a watched directory."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Md Rashedul Hasan" }]
keywords = ["cli", "timeout", "filesystem", "delta", "agents", "sandbox"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sandclock = "sandclock.cli:main"

[project.urls]
Homepage = "https://github.com/rashedhasan090/sandclock"
Author = "https://www.mdrashedulhasan.me"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
